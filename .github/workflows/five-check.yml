name: Five facilities availability check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-facility-manual-check
  cancel-in-progress: false
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free open-source parsers (no cache)
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Check five public facilities
        run: python check_five.py
