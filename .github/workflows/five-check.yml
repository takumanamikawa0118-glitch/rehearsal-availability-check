name: Five facilities availability check
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: five-facility-check
  cancel-in-progress: false
jobs:
  check:
    # Standard public-repository runner only. Set AVAILABILITY_PAUSED=true to pause.
    if: github.event.repository.private == false && vars.AVAILABILITY_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: .availability-cache
          key: katabira-v4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: katabira-v4-
      - name: Install free local OCR
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn tesseract-ocr-eng
      - name: Install free open-source parsers (no cache)
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Check and save five public facilities
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python availability-service/collect_and_send.py
      - uses: actions/cache/save@v5
        if: always() && !cancelled()
        with:
          path: .availability-cache
          key: katabira-v4-${{ github.run_id }}-${{ github.run_attempt }}
