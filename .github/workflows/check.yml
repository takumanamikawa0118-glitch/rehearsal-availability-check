name: Tokiwadai connection check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tokiwadai-manual-check
  cancel-in-progress: false
jobs:
  check:
    # Run only in a public repository with the free standard runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public website (two requests only)
        run: python3 tokiwadai_connection_probe.py
